<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 420"><title>Opciones de flecha</title><rect width="1500" height="420" fill="#FFFFFF"/><text x="750" y="70" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, Inter, sans-serif" font-size="40" font-weight="700" letter-spacing="0" fill="#121860">Orientación de flecha — a confirmar por acceso y cara</text><rect x="60" y="120" width="220" height="220" rx="24" fill="#121860"/><g id="flecha-0" data-orientacion-grados="0" transform="translate(170 230) rotate(0) scale(0.6)"><polygon points="0,-150 118,-22 42,-22 42,150 -42,150 -42,-22 -118,-22" fill="#FFFFFF"/></g><text x="170" y="390" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, Inter, sans-serif" font-size="30" font-weight="600" letter-spacing="0" fill="#121860">Avance</text><rect x="350" y="120" width="220" height="220" rx="24" fill="#121860"/><g id="flecha--45" data-orientacion-grados="-45" transform="translate(460 230) rotate(-45) scale(0.6)"><polygon points="0,-150 118,-22 42,-22 42,150 -42,150 -42,-22 -118,-22" fill="#FFFFFF"/></g><text x="460" y="390" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, Inter, sans-serif" font-size="30" font-weight="600" letter-spacing="0" fill="#121860">Diagonal izq.</text><rect x="640" y="120" width="220" height="220" rx="24" fill="#121860"/><g id="flecha-45" data-orientacion-grados="45" transform="translate(750 230) rotate(45) scale(0.6)"><polygon points="0,-150 118,-22 42,-22 42,150 -42,150 -42,-22 -118,-22" fill="#FFFFFF"/></g><text x="750" y="390" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, Inter, sans-serif" font-size="30" font-weight="600" letter-spacing="0" fill="#121860">Diagonal der.</text><rect x="930" y="120" width="220" height="220" rx="24" fill="#121860"/><g id="flecha--90" data-orientacion-grados="-90" transform="translate(1040 230) rotate(-90) scale(0.6)"><polygon points="0,-150 118,-22 42,-22 42,150 -42,150 -42,-22 -118,-2